name: flutter_project
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.4
  get_storage: ^2.1.1
  image: ^4.7.2
  flutter_screenutil: ^5.9.3
  image_picker: ^1.0.7
  get: ^4.7.3
  intl:
  flutter_localization:
  path_provider: ^2.1.2
  http_parser: ^4.0.2
  record: ^6.2.0
  just_audio: ^0.9.40
  flutter_math_fork: ^0.7.2
  lottie: ^3.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter




flutter:
  generate: true


  uses-material-design: true


  assets:
    - assets/images/
    - assets/lottie/avatar_placeholder.json




  fonts:
     - family: Customfonts
       fonts:
         - asset: assets/fonts/Montserrat-Regular.ttf



     - family: Customfonts2
       fonts:
         - asset: assets/fonts/Bitter-Italic.ttf
  #       - asset: fonts/Schyler-Italic.ttf

